<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — MomentoCrypto</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: #080808; color: #f5f5f5; min-height: 100vh; }
.checkout-wrap { max-width: 460px; margin: 0 auto; padding: 40px 20px; }
.logo { text-align: center; margin-bottom: 28px; }
.logo span { font-size: 18px; font-weight: 700; color: #39FF14; letter-spacing: 2px; }
h1 { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 4px; }
.subtitle { text-align: center; color: rgba(245,245,245,0.45); font-size: 13px; margin-bottom: 28px; }

/* Payment methods */
.section-label { font-size: 11px; font-weight: 600; color: rgba(245,245,245,0.4); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.methods { display: flex; gap: 10px; margin-bottom: 24px; }
.method-opt {
  flex: 1; padding: 16px 14px; background: #111; border: 2px solid #1a1a1a; border-radius: 14px;
  cursor: pointer; text-align: center; transition: border-color 0.2s, background 0.2s; position: relative;
}
.method-opt:hover { border-color: #333; }
.method-opt.active { border-color: #39FF14; background: rgba(57,255,20,0.04); }
.method-icons { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 8px; min-height: 24px; }
.method-name { font-size: 15px; font-weight: 600; color: #f5f5f5; }
.method-sub { font-size: 11px; color: rgba(245,245,245,0.35); margin-top: 2px; }
.discount-badge {
  position: absolute; top: -9px; right: -9px;
  background: #39FF14; color: #000; font-size: 10px; font-weight: 800;
  padding: 3px 8px; border-radius: 8px; letter-spacing: 0.3px;
}

/* Package dropdown */
.pkg-select-wrap { margin-bottom: 24px; }
.pkg-select {
  width: 100%; padding: 14px 16px; background: #111; border: 1px solid #1a1a1a; border-radius: 12px;
  color: #f5f5f5; font-size: 15px; font-family: inherit; appearance: none; cursor: pointer;
  background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%23666' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat; background-position: right 16px center;
}
.pkg-select:focus { outline: none; border-color: #39FF14; }

/* Summary */
.summary { background: #111; border: 1px solid #1a1a1a; border-radius: 14px; padding: 16px; margin-bottom: 20px; }
.summary-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 13px; }
.summary-row.total { border-top: 1px solid #1a1a1a; margin-top: 8px; padding-top: 10px; font-size: 16px; font-weight: 700; }
.s-label { color: rgba(245,245,245,0.4); }
.s-val { color: #f5f5f5; font-weight: 600; }
.s-green { color: #39FF14; }
.s-discount { color: #39FF14; font-size: 12px; }

/* Pay button */
.pay-btn {
  width: 100%; padding: 16px; background: #39FF14; color: #000; border: none; border-radius: 14px;
  font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer; transition: opacity 0.15s;
}
.pay-btn:hover { opacity: 0.9; }
.pay-btn:disabled { opacity: 0.35; cursor: not-allowed; }

.secure { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 14px; font-size: 11px; color: rgba(245,245,245,0.25); }

/* Payment icons row on bottom */
.payment-icons { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 20px; padding-top: 20px; border-top: 1px solid #1a1a1a; }
.payment-icons img { height: 20px; opacity: 0.4; }

.error-msg { background: rgba(255,69,58,0.1); border: 1px solid rgba(255,69,58,0.2); color: #ff453a; padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; display: none; }

@media (max-width: 480px) { .methods { flex-direction: column; } }
</style>
</head>
<body>
<div class="checkout-wrap">
  <div class="logo"><span>MOMENTOCRYPTO</span></div>
  <h1>Checkout</h1>
  <p class="subtitle">Select your plan and payment method</p>

  <div id="errorMsg" class="error-msg"></div>

  <!-- Payment method -->
  <div class="section-label">Payment Method</div>
  <div class="methods" id="methods">
    <div class="method-opt active" onclick="selectMethod('card')">
      <div class="method-icons">
        <img src="assets/icons/visa.svg" alt="Visa" height="14">
        <img src="assets/icons/mastercard.svg" alt="Mastercard" height="18">
      </div>
      <div class="method-name">Card</div>
      <div class="method-sub">Visa / Mastercard</div>
    </div>
    <div class="method-opt" onclick="selectMethod('crypto')" style="position:relative;">
      <div class="discount-badge">-5%</div>
      <div class="method-icons">
        <img src="assets/icons/btc.svg" alt="BTC" height="20">
        <img src="assets/icons/eth.svg" alt="ETH" height="20">
        <img src="assets/icons/usdt.svg" alt="USDT" height="20">
      </div>
      <div class="method-name">Crypto</div>
      <div class="method-sub">50+ coins accepted</div>
    </div>
  </div>

  <!-- Package dropdown -->
  <div class="section-label">Plan</div>
  <div class="pkg-select-wrap">
    <select class="pkg-select" id="pkgSelect" onchange="updateSummary()">
      <option value="starter">Starter — 1 Month</option>
      <option value="trader">Trader — 3 Months (save 20%)</option>
      <option value="pro">Pro — 6 Months (save 33%)</option>
    </select>
  </div>

  <!-- Summary -->
  <div class="summary" id="summary">
    <div class="summary-row">
      <span class="s-label">Plan</span>
      <span class="s-val" id="sumPlan">Starter — 1 Month</span>
    </div>
    <div class="summary-row">
      <span class="s-label">Method</span>
      <span class="s-val" id="sumMethod">Card (Visa/MC)</span>
    </div>
    <div class="summary-row" id="discountRow" style="display:none;">
      <span class="s-label">Crypto Discount</span>
      <span class="s-discount" id="sumDiscount">-5%</span>
    </div>
    <div class="summary-row total">
      <span class="s-label">Total</span>
      <span class="s-val s-green" id="sumTotal">€23.00</span>
    </div>
  </div>

  <button class="pay-btn" id="payBtn" onclick="pay()">Pay €23.00</button>

  <div class="secure">🔒 Secure payment · Instant access after payment</div>

  <div class="payment-icons">
    <img src="assets/icons/visa.svg" alt="Visa">
    <img src="assets/icons/mastercard.svg" alt="Mastercard">
    <img src="assets/icons/btc.svg" alt="BTC">
    <img src="assets/icons/eth.svg" alt="ETH">
    <img src="assets/icons/usdt.svg" alt="USDT">
  </div>
</div>

<script>
const packages = {
  starter: { name: 'Starter — 1 Month', eur: 23, usd: 25 },
  trader:  { name: 'Trader — 3 Months', eur: 55, usd: 60 },
  pro:     { name: 'Pro — 6 Months', eur: 92, usd: 100 },
};
let method = 'card';

function selectMethod(m) {
  method = m;
  document.querySelectorAll('.method-opt').forEach((el, i) => el.classList.toggle('active', ['card','crypto'][i] === m));
  updateSummary();
}

function updateSummary() {
  const pkg = packages[document.getElementById('pkgSelect').value];
  const isCrypto = method === 'crypto';
  const base = isCrypto ? pkg.usd : pkg.eur;
  const discount = isCrypto ? Math.round(base * 0.05 * 100) / 100 : 0;
  const total = base - discount;
  const cur = isCrypto ? '$' : '€';

  document.getElementById('sumPlan').textContent = pkg.name;
  document.getElementById('sumMethod').textContent = isCrypto ? 'Crypto (BTC, ETH, USDT...)' : 'Card (Visa/MC)';
  document.getElementById('discountRow').style.display = isCrypto ? 'flex' : 'none';
  if (isCrypto) document.getElementById('sumDiscount').textContent = `-${cur}${discount.toFixed(2)}`;
  document.getElementById('sumTotal').textContent = `${cur}${total.toFixed(2)}`;
  document.getElementById('payBtn').textContent = `Pay ${cur}${total.toFixed(2)}`;
  document.getElementById('errorMsg').style.display = 'none';
}

async function pay() {
  const btn = document.getElementById('payBtn');
  const pkgKey = document.getElementById('pkgSelect').value;
  btn.disabled = true; btn.textContent = 'Processing...';
  document.getElementById('errorMsg').style.display = 'none';

  try {
    if (method === 'crypto') {
      const res = await fetch('/api/pay.php', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ package: pkgKey }),
      });
      const data = await res.json();
      if (data.ok && data.payment_url) { window.location.href = data.payment_url; }
      else throw new Error(data.error || 'Failed to create payment');
    } else {
      const res = await fetch('/api/pay-payou.php', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ package: pkgKey }),
      });
      const data = await res.json();
      if (data.ok && data.redirect) { window.location.href = data.redirect; }
      else throw new Error(data.error || 'Failed to create payment');
    }
  } catch (e) {
    document.getElementById('errorMsg').textContent = e.message;
    document.getElementById('errorMsg').style.display = 'block';
    btn.disabled = false; updateSummary();
  }
}

updateSummary();
</script>
</body>
</html>
