<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening Telegram…</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: #e8e8ef;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .wrap { text-align: center; padding: 2rem; }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #7c6cff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 0.95rem; opacity: 0.85; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner" aria-hidden="true"></div>
    <p>Opening Telegram…</p>
  </div>
  <script>
    (function () {
      // --- Deploy-time config (replace before uploading to momentocrypto.com/go) ---
      var API_BASE = 'https://tradebot-production-4b0f.up.railway.app';
      var BOT_USERNAME = 'momentocryptosignals_bot';
      // -------------------------------------------------------------------------------

      function getCookie(name) {
        var m = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '=([^;]*)'));
        return m ? decodeURIComponent(m[1]) : '';
      }

      function getParam(name) {
        return new URLSearchParams(window.location.search).get(name) || '';
      }

      function buildFbc(fbclid) {
        if (!fbclid) return '';
        var existing = getCookie('_fbc');
        if (existing) return existing;
        return 'fb.1.' + Date.now() + '.' + fbclid;
      }

      function landingUrl() {
        if (document.referrer) return document.referrer;
        var q = window.location.search || '';
        return 'https://momentocrypto.com/in' + q;
      }

      function botUrl(token) {
        var base = 'https://t.me/' + encodeURIComponent(BOT_USERNAME);
        return token ? base + '?start=' + encodeURIComponent(token) : base;
      }

      function waitForFbp(ms, maxMs) {
        return new Promise(function (resolve) {
          var elapsed = 0;
          var step = 100;
          function tick() {
            if (getCookie('_fbp') || elapsed >= maxMs) {
              resolve();
              return;
            }
            elapsed += step;
            setTimeout(tick, step);
          }
          setTimeout(tick, ms);
        });
      }

      function issueAttribution() {
        var fbclid = getParam('fbclid');
        var body = {
          fbclid: fbclid || null,
          fbp: getCookie('_fbp') || null,
          fbc: buildFbc(fbclid) || null,
          landing_url: landingUrl(),
          referrer: document.referrer || null
        };
        var url = API_BASE.replace(/\/$/, '') + '/api/attribution/issue';
        return fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        }).then(function (res) {
          if (!res.ok) throw new Error('issue failed');
          return res.json();
        });
      }

      waitForFbp(500, 1500).then(function () {
        return issueAttribution();
      }).then(function (data) {
        window.location.href = botUrl(data && data.token ? data.token : '');
      }).catch(function () {
        window.location.href = botUrl('');
      });
    })();
  </script>
</body>
</html>
